appId: com.sciora.lecturer
productName: Sciora Lecturer Console
directories:
  output: dist-electron
  buildResources: public

afterPack: scripts/after-pack.js

extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"

files:
  - "electron/**/*"
  - "package.json"

win:
  target:
    - target: portable
      arch:
        - x64
  icon: public/icon.png

portable:
  artifactName: "Sciora-Lecturer-Console.exe"
