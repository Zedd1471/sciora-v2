appId: com.sciora.lecturer
productName: Sciora Lecturer Console
directories:
  output: dist-desktop
  buildResources: public

afterPack: scripts/after-pack.js

extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"

files:
  - "electron/**/*"
  - "package.json"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.png

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Sciora Lecturer Console"
  artifactName: "Sciora-Lecturer-Setup.exe"
