<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sciora — Lecturer Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
      padding: 32px;
      text-align: center;
    }
    .logo-box {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px -8px rgba(99, 102, 241, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      margin-bottom: 24px;
      position: relative;
    }
    .logo-box svg {
      width: 36px;
      height: 36px;
      color: #ffffff;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 13px;
      color: #71717a;
      margin-bottom: 24px;
    }
    .loader-track {
      width: 220px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 999px;
      position: absolute;
      animation: sweep 1.4s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { left: -40%; width: 25%; }
      50% { width: 45%; }
      100% { left: 100%; width: 20%; }
    }
    .status {
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 16px;
      min-height: 18px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #a5b4fc;
      font-weight: 600;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
      </svg>
    </div>
    <h1>Sciora Lecturer Console</h1>
    <p class="subtitle">Offline Classroom Operations Engine</p>
    
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
    
    <div id="status" class="status">Starting offline Next.js background server...</div>
    <div class="pill">
      <div class="dot"></div>
      <span id="hotspot-badge">Classroom Hotspot: Initializing</span>
    </div>
  </div>

  <script>
    if (window.scioraDesktop?.getHotspotInfo) {
      window.scioraDesktop.getHotspotInfo().then((info) => {
        const badge = document.getElementById("hotspot-badge");
        if (badge && info?.ip) {
          badge.textContent = `Hotspot IP: ${info.ip}:${info.port || 3000}`;
        }
      });
    }
  </script>
</body>
</html>
